<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试表格渲染</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">🐛 调试：起涨/起跌点列渲染</h1>
    
    <div class="mb-4 bg-blue-100 p-4 rounded">
        <h2 class="font-bold">测试说明：</h2>
        <ul class="list-disc ml-6 text-sm">
            <li>此页面独立测试表格渲染逻辑</li>
            <li>前20行应显示 "-"</li>
            <li>第20行及以后应显示累计百分比（如 "+1.50%" 或 "-0.80%"）</li>
            <li>如果这里能正常显示，说明逻辑没问题，是kline.html的问题</li>
            <li>如果这里也不显示，说明浏览器有兼容性问题</li>
        </ul>
    </div>
    
    <table class="w-full border-collapse border border-gray-300">
        <thead class="bg-gray-200">
            <tr>
                <th class="border border-gray-300 px-2 py-1">序号</th>
                <th class="border border-gray-300 px-2 py-1">时间</th>
                <th class="border border-gray-300 px-2 py-1 bg-blue-100">起涨/起跌点</th>
                <th class="border border-gray-300 px-2 py-1">涨跌幅</th>
                <th class="border border-gray-300 px-2 py-1">收盘价</th>
            </tr>
        </thead>
        <tbody id="testTableBody">
            <tr><td colspan="5" class="text-center py-4">加载中...</td></tr>
        </tbody>
    </table>
    
    <div id="logs" class="mt-4 bg-gray-100 p-4 rounded font-mono text-xs"></div>
    
    <script>
        const logs = [];
        function log(msg) {
            logs.push(msg);
            console.log(msg);
            document.getElementById('logs').innerHTML = logs.join('<br>');
        }
        
        log('🚀 开始测试...');
        
        // 模拟从API获取的数据
        const klineData = [];
        for (let i = 0; i < 25; i++) {
            klineData.push({
                time: `2025/10/29 ${String(17 - Math.floor(i/12)).padStart(2, '0')}:${String((60 - (i*5) % 60) % 60).padStart(2, '0')}`,
                change: `${Math.random() > 0.5 ? '' : '-'}${(Math.random() * 0.3).toFixed(2)}%`,
                close: 112000 + Math.random() * 1000,
                index: i
            });
        }
        
        log(`✓ 生成了 ${klineData.length} 条测试数据`);
        
        // 渲染表格
        const tbody = document.getElementById('testTableBody');
        
        const html = klineData.map((k, index) => {
            // 计算累计涨跌幅
            let cumulative20Change = 0;
            let hasEnoughData = false;
            
            if (index >= 20) {
                for (let i = index - 20; i < index; i++) {
                    const changeStr = klineData[i].change;
                    if (changeStr) {
                        const changeValue = parseFloat(changeStr);
                        if (!isNaN(changeValue)) {
                            cumulative20Change += changeValue;
                        }
                    }
                }
                hasEnoughData = true;
            }
            
            const isRisingPattern = hasEnoughData && cumulative20Change > 2;
            const isFallingPattern = hasEnoughData && cumulative20Change < -3;
            
            const cumulativeBadge = hasEnoughData 
                ? `<span class="inline-block px-2 py-1 text-xs rounded ${
                    isRisingPattern ? 'bg-green-600 text-white font-bold' : 
                    isFallingPattern ? 'bg-red-600 text-white font-bold' : 
                    'bg-gray-300 text-gray-700'
                  }" title="过去20根K线累计涨跌幅">${cumulative20Change > 0 ? '+' : ''}${cumulative20Change.toFixed(2)}%</span>`
                : '<span class="text-gray-400 font-bold">-</span>';
            
            // 调试日志
            if (index === 0 || index === 19 || index === 20 || index === 24) {
                log(`Row ${index}: hasEnoughData=${hasEnoughData}, cumulative=${cumulative20Change.toFixed(2)}%, badge="${cumulativeBadge.substring(0, 50)}..."`);
            }
            
            return `
                <tr class="border-b">
                    <td class="border border-gray-300 px-2 py-1 text-center">${index}</td>
                    <td class="border border-gray-300 px-2 py-1">${k.time}</td>
                    <td class="border border-gray-300 px-2 py-1 text-center bg-blue-50">${cumulativeBadge}</td>
                    <td class="border border-gray-300 px-2 py-1 text-right">${k.change}</td>
                    <td class="border border-gray-300 px-2 py-1 text-right">${k.close.toFixed(2)}</td>
                </tr>
            `;
        }).join('');
        
        tbody.innerHTML = html;
        log(`✓ 表格渲染完成，共 ${klineData.length} 行`);
        log('');
        log('📊 检查结果：');
        log('  - 如果第3列（起涨/起跌点）有内容，说明代码正常');
        log('  - 如果第3列是空白，请检查浏览器控制台是否有错误');
    </script>
</body>
</html>
