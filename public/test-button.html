<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按钮测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6">自动交易配置按钮测试</h1>
        
        <!-- 测试表单 -->
        <form id="testForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">测试输入</label>
                <input type="text" id="testInput" class="w-full px-3 py-2 border rounded" placeholder="输入任何内容">
            </div>
            
            <div id="result" class="p-4 bg-gray-100 rounded hidden">
                <p class="font-bold">表单提交结果：</p>
                <p id="resultText"></p>
            </div>
        </form>
        
        <!-- 测试按钮 - 在表单外 -->
        <div class="mt-6 space-y-4">
            <h2 class="text-lg font-bold">测试按钮（表单外）</h2>
            
            <button 
                type="button"
                id="testBtn1"
                class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg"
            >
                方法1: Event Listener (当前使用)
            </button>
            
            <button 
                type="button"
                onclick="document.getElementById('testForm').requestSubmit()"
                class="w-full bg-green-600 text-white px-6 py-3 rounded-lg"
            >
                方法2: Inline requestSubmit()
            </button>
            
            <button 
                type="button"
                onclick="manualSubmit()"
                class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg"
            >
                方法3: 全局函数调用
            </button>
            
            <button 
                type="submit"
                form="testForm"
                class="w-full bg-orange-600 text-white px-6 py-3 rounded-lg"
            >
                方法4: form属性
            </button>
        </div>
        
        <!-- 日志显示 -->
        <div class="mt-6">
            <h2 class="text-lg font-bold mb-2">调试日志</h2>
            <div id="log" class="bg-black text-green-400 p-4 rounded font-mono text-sm h-64 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const log = (message) => {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        };
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', () => {
            log('✅ DOM 加载完成');
            
            // 方法1: 添加事件监听器
            const btn1 = document.getElementById('testBtn1');
            if (btn1) {
                log('✅ 找到 testBtn1 元素');
                btn1.addEventListener('click', () => {
                    log('🔘 方法1: Event Listener 被点击');
                    const event = new Event('submit', { bubbles: true, cancelable: true });
                    document.getElementById('testForm').dispatchEvent(event);
                });
            } else {
                log('❌ 未找到 testBtn1 元素');
            }
            
            // 表单提交处理
            document.getElementById('testForm').addEventListener('submit', (e) => {
                e.preventDefault();
                log('📝 表单 submit 事件被触发');
                const value = document.getElementById('testInput').value;
                
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('resultText').textContent = `输入值: ${value || '(空)'}`;
                
                log(`✅ 表单提交成功! 输入值: ${value || '(空)'}`);
            });
            
            log('✅ 事件监听器绑定完成');
        });
        
        // 方法3: 全局函数
        function manualSubmit() {
            log('🔘 方法3: 全局函数被调用');
            const event = new Event('submit', { bubbles: true, cancelable: true });
            document.getElementById('testForm').dispatchEvent(event);
        }
        
        log('📄 脚本加载完成，等待 DOM...');
    </script>
</body>
</html>
