<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比价画面 - V5.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
            font-size: 12px;
            background: #f0f0f0;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            background: #e8e8e8;
            border-bottom: 1px solid #999;
            padding: 6px 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            height: 32px;
        }

        .toolbar-item {
            cursor: pointer;
            padding: 3px 10px;
            user-select: none;
            border: 1px solid transparent;
            background: #e0e0e0;
        }

        .toolbar-item:hover {
            background: #d0d0d0;
        }

        .toolbar-item.active {
            background: #fff;
            border: 1px solid #999;
            font-weight: bold;
        }

        /* 主容器 */
        .main-container {
            height: calc(100vh - 95px);
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid #999;
            margin: 2px;
        }

        /* 表格容器 */
        .table-wrapper {
            flex: 1;
            overflow: auto;
            border: 1px solid #c0c0c0;
        }

        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .data-table th {
            background: #e0e0e0;
            border: 1px solid #999;
            padding: 4px 6px;
            text-align: center;
            font-weight: bold;
            white-space: nowrap;
            font-size: 11px;
        }

        .data-table td {
            border: 1px solid #d0d0d0;
            padding: 3px 6px;
            text-align: right;
            white-space: nowrap;
        }

        .data-table tbody tr:hover {
            background: #e8f4ff;
        }

        /* 序号和币名列左对齐 */
        .data-table td:nth-child(1),
        .data-table td:nth-child(2) {
            text-align: center;
        }

        /* 颜色样式 */
        .green-bg {
            background: #00ff00 !important;
            color: #000;
            font-weight: bold;
        }

        .red-bg {
            background: #ff0000 !important;
            color: #fff;
            font-weight: bold;
        }

        .yellow-bg {
            background: #ffff00 !important;
            color: #000;
            font-weight: bold;
        }

        .light-green-bg {
            background: #90ee90 !important;
            color: #000;
        }

        .light-red-bg {
            background: #ffb0b0 !important;
            color: #000;
        }

        /* 底部控制栏 */
        .control-bar {
            background: #f0f0f0;
            padding: 8px 10px;
            border-top: 1px solid #999;
            display: flex;
            gap: 10px;
            align-items: center;
            height: 36px;
        }

        .control-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .control-label {
            font-size: 12px;
            color: #333;
        }

        .control-input {
            padding: 3px 6px;
            border: 1px solid #999;
            font-size: 12px;
            width: 100px;
            height: 22px;
        }

        .control-btn {
            padding: 3px 12px;
            border: 1px solid #999;
            background: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            height: 24px;
        }

        .control-btn:hover {
            background: #d0d0d0;
        }

        .control-btn:active {
            background: #c0c0c0;
        }

        /* 状态栏 */
        .status-bar {
            background: #f0f0f0;
            padding: 3px 10px;
            border-top: 1px solid #999;
            font-size: 11px;
            color: #333;
            display: flex;
            justify-content: space-between;
            height: 22px;
            align-items: center;
        }

        /* 滚动条样式 */
        .table-wrapper::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border: 1px solid #999;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* 趋势箭头 */
        .trend-up {
            color: red;
            font-weight: bold;
        }

        .trend-down {
            color: green;
            font-weight: bold;
        }

        .trend-neutral {
            color: #666;
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-item">首页</div>
        <div class="toolbar-item">查询</div>
        <div class="toolbar-item">趋势</div>
        <div class="toolbar-item active">比价</div>
        <div class="toolbar-item">监控比价</div>
        <div class="toolbar-item">盘径</div>
        <div class="toolbar-item">重点监控</div>
        <div class="toolbar-item">查询</div>
        <div class="toolbar-item">工具</div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 30px;">序</th>
                        <th style="width: 50px;">币名</th>
                        <th style="width: 50px;">涨跌</th>
                        <th style="width: 40px;">急涨</th>
                        <th style="width: 40px;">急跌</th>
                        <th style="width: 140px;">更新时间</th>
                        <th style="width: 100px;">历史高点</th>
                        <th style="width: 140px;">高点时间</th>
                        <th style="width: 80px;">24小时</th>
                        <th style="width: 60px;">24变幅</th>
                        <th style="width: 50px;">+4%</th>
                        <th style="width: 50px;">排行</th>
                        <th style="width: 100px;">当前估价</th>
                        <th style="width: 80px;">最高占比</th>
                        <th style="width: 80px;">最低占比</th>
                        <th style="width: 50px;">势力</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="16" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 底部控制栏 -->
    <div class="control-bar">
        <div class="control-group">
            <span class="control-label">输入筛选条件：</span>
            <input type="text" class="control-input" id="filterInput" placeholder="币名筛选...">
        </div>
        <button class="control-btn" id="filterBtn">筛选</button>
        <button class="control-btn" id="refreshBtn">刷新</button>
        <button class="control-btn" id="exportBtn">导出</button>
        <button class="control-btn" id="settingsBtn">设置</button>
        <div style="flex: 1;"></div>
        <button class="control-btn" id="autoRefreshBtn">■ 自动刷新</button>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div>
            <span>比价画面 0 0</span>
            <span style="margin-left: 20px;">盘进盘出 计次 0 2</span>
        </div>
        <div id="statusInfo">就绪 tok.en AT_IT2I.qtWJVJl3Gu.ewTg7uNh9F.ew8gBu.giJk</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/compare.js"></script>
</body>
</html>
