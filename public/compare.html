<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比价 - V5.5</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
            font-size: 12px;
            background: #f0f0f0;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            background: #e8e8e8;
            border-bottom: 1px solid #999;
            padding: 6px 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            height: 32px;
        }

        .toolbar-item {
            cursor: pointer;
            padding: 3px 10px;
            user-select: none;
            border: 1px solid transparent;
            background: #e0e0e0;
        }

        .toolbar-item:hover {
            background: #d0d0d0;
        }

        .toolbar-item.active {
            background: #fff;
            border: 1px solid #999;
            font-weight: bold;
        }

        /* 主容器：三栏布局 */
        .main-container {
            height: calc(100vh - 95px);
            display: flex;
            gap: 2px;
            background: #c0c0c0;
            padding: 2px;
        }

        /* 左栏：最高价格 */
        .left-panel {
            flex: 1.2;
            background: white;
            display: flex;
            flex-direction: column;
            border: 1px solid #999;
        }

        /* 中栏：时间信息 */
        .center-panel {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            border: 1px solid #999;
        }

        /* 右栏：最低价格 */
        .right-panel {
            flex: 0.8;
            background: white;
            display: flex;
            flex-direction: column;
            border: 1px solid #999;
        }

        /* 面板标题 */
        .panel-header {
            background: #e0e0e0;
            border-bottom: 1px solid #999;
            padding: 6px 8px;
            font-weight: bold;
            text-align: center;
        }

        /* 表格容器 */
        .table-wrapper {
            flex: 1;
            overflow: auto;
        }

        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th {
            background: #d0d0d0;
            border: 1px solid #999;
            padding: 4px 4px;
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            white-space: nowrap;
        }

        .data-table td {
            border: 1px solid #d0d0d0;
            padding: 2px 4px;
            text-align: right;
            font-size: 11px;
            white-space: nowrap;
        }

        .data-table tbody tr:hover {
            background: #e8f4ff;
        }

        /* 币名列居中 */
        .coin-name {
            text-align: center !important;
            font-weight: bold;
        }

        /* 计次列 */
        .count-column {
            text-align: center !important;
        }

        /* 颜色样式 */
        .green-bg {
            background: #00ff00 !important;
            color: #000;
            font-weight: bold;
        }

        .red-bg {
            background: #ff0000 !important;
            color: #fff;
            font-weight: bold;
        }

        .yellow-bg {
            background: #ffff00 !important;
            color: #000;
            font-weight: bold;
        }

        .light-green-bg {
            background: #90ee90 !important;
            color: #000;
        }

        .light-yellow-bg {
            background: #ffffcc !important;
            color: #000;
        }

        /* 底部控制栏 */
        .control-bar {
            background: #f0f0f0;
            padding: 8px 10px;
            border-top: 1px solid #999;
            display: flex;
            gap: 10px;
            align-items: center;
            height: 36px;
        }

        .control-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .control-label {
            font-size: 12px;
            color: #333;
        }

        .control-input {
            padding: 3px 6px;
            border: 1px solid #999;
            font-size: 12px;
            width: 120px;
            height: 22px;
        }

        .control-btn {
            padding: 3px 12px;
            border: 1px solid #999;
            background: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            height: 24px;
        }

        .control-btn:hover {
            background: #d0d0d0;
        }

        .control-btn:active {
            background: #c0c0c0;
        }

        /* 状态栏 */
        .status-bar {
            background: #f0f0f0;
            padding: 3px 10px;
            border-top: 1px solid #999;
            font-size: 11px;
            color: #333;
            display: flex;
            justify-content: space-between;
            height: 22px;
            align-items: center;
        }

        /* 滚动条 */
        .table-wrapper::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border: 1px solid #999;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* 加载提示 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        /* 标记列样式 */
        .mark-column {
            text-align: center !important;
            font-weight: bold;
        }

        /* 时间列样式 */
        .time-column {
            text-align: center !important;
            font-size: 10px;
        }

        /* 状态列样式 */
        .status-column {
            text-align: center !important;
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <a href="/" class="toolbar-item" style="text-decoration: none; color: inherit;">
            <i class="fas fa-home" style="margin-right: 4px;"></i>首页
        </a>
        <div class="toolbar-item">查询</div>
        <div class="toolbar-item">趋势</div>
        <div class="toolbar-item active">比价</div>
        <div class="toolbar-item">监控比价</div>
        <div class="toolbar-item">盘径</div>
        <div class="toolbar-item">重点监控</div>
        <div class="toolbar-item">查询</div>
        <div class="toolbar-item">工具</div>
    </div>

    <!-- 主容器：三栏布局 -->
    <div class="main-container">
        <!-- 左栏：极值记录 -->
        <div class="left-panel">
            <div class="panel-header">极值记录</div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">币名</th>
                            <th style="width: 140px;">时间</th>
                            <th style="width: 60px;">状态</th>
                            <th style="width: 100px;">价格</th>
                        </tr>
                    </thead>
                    <tbody id="leftTableBody">
                        <tr>
                            <td colspan="4" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 中栏：时间信息 -->
        <div class="center-panel">
            <div class="panel-header">时间</div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">币名</th>
                            <th style="width: 140px;">时间</th>
                            <th style="width: 60px;">状态</th>
                            <th style="width: 60px;">特播</th>
                        </tr>
                    </thead>
                    <tbody id="centerTableBody">
                        <tr>
                            <td colspan="4" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 右栏：统计数据（可切换最高/最低） -->
        <div class="right-panel">
            <div class="panel-header">
                <span id="rightPanelTitle">最高</span>
                <button id="toggleStatsBtn" style="margin-left: 10px; padding: 2px 8px; border: 1px solid #999; background: #f0f0f0; cursor: pointer; font-size: 11px;">切换</button>
            </div>
            <div class="table-wrapper">
                <!-- 最高统计表 -->
                <table class="data-table" id="highStatsTable">
                    <thead>
                        <tr>
                            <th style="width: 50px;">币名</th>
                            <th style="width: 40px;">今天</th>
                            <th style="width: 40px;">三日</th>
                            <th style="width: 40px;">七天</th>
                        </tr>
                    </thead>
                    <tbody id="highStatsBody">
                        <tr>
                            <td colspan="4" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- 最低统计表（初始隐藏） -->
                <table class="data-table" id="lowStatsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th style="width: 50px;">币名</th>
                            <th style="width: 40px;">今天</th>
                            <th style="width: 40px;">三日</th>
                            <th style="width: 40px;">七天</th>
                        </tr>
                    </thead>
                    <tbody id="lowStatsBody">
                        <tr>
                            <td colspan="4" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 底部控制栏 -->
    <div class="control-bar">
        <div class="control-group">
            <span class="control-label">币名</span>
            <input type="text" class="control-input" id="filterInput" placeholder="筛选...">
        </div>
        <div class="control-group">
            <span class="control-label">最大</span>
            <input type="text" class="control-input" id="maxInput" placeholder="">
        </div>
        <div class="control-group">
            <span class="control-label">最小</span>
            <input type="text" class="control-input" id="minInput" placeholder="">
        </div>
        <button class="control-btn" id="addBtn">添加</button>
        <button class="control-btn" id="deleteBtn">删除</button>
        <button class="control-btn" id="exportBtn">导出</button>
        <button class="control-btn" id="importBtn">导入</button>
        <div style="flex: 1;"></div>
        <span id="summaryText" style="font-size: 11px;">比价榜单 5 1 &nbsp;&nbsp;&nbsp; 盘进榜单 计次 5 6</span>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div>
            <span>推送 token</span>
            <span style="margin-left: 20px;" id="tokenText">AT_IT2I.qtWJVJl3Gu.ewTg7uNh9F.ew8gBu.giJk</span>
        </div>
        <div>
            <button class="control-btn" style="height: 18px; padding: 2px 8px;" id="configBtn">推送为因群桂</button>
            <button class="control-btn" style="height: 18px; padding: 2px 8px; margin-left: 5px;" id="machineBtn">机器号</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/compare.js"></script>
</body>
</html>
