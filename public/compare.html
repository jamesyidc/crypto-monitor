<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>币价比价系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            font-weight: bold;
        }

        .header-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .info-item {
            font-size: 14px;
            color: #666;
        }

        .info-item strong {
            color: #333;
            margin-right: 5px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .filter-section {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-input {
            flex: 1;
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .filter-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .main-content {
            display: flex;
            gap: 20px;
            min-height: 600px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            flex: 3;
        }

        .middle-panel {
            flex: 2;
        }

        .right-panel {
            flex: 2;
        }

        .panel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .table-wrapper {
            overflow-y: auto;
            flex: 1;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
        }

        .data-table th {
            padding: 12px 8px;
            text-align: center;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            font-size: 14px;
        }

        .data-table td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #555;
        }

        .data-table tbody tr:hover {
            background: #f8f9fa;
        }

        .coin-name {
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }

        /* 计次列样式 */
        .count-column {
            background-color: #fff9c4 !important;
            font-weight: bold;
        }

        /* 占比背景色 */
        .green-bg {
            background-color: #4caf50 !important;
            color: white;
            font-weight: bold;
        }

        .light-green-bg {
            background-color: #8bc34a !important;
            color: white;
        }

        .yellow-bg {
            background-color: #ffeb3b !important;
            color: #333;
        }

        .light-yellow-bg {
            background-color: #fff59d !important;
            color: #333;
        }

        /* 状态标签 */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-high {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-low {
            background-color: #fff3e0;
            color: #e65100;
        }

        /* 时间段计数样式 */
        .count-cell {
            font-weight: bold;
            color: #667eea;
        }

        .count-cell.has-value {
            background-color: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> 币价比价系统</h1>
            <div class="header-info">
                <div class="info-item">
                    <strong>更新时间:</strong>
                    <span id="updateTime">--</span>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='/'">
                    <i class="fas fa-home"></i> 返回首页
                </button>
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <i class="fas fa-filter" style="color: #667eea;"></i>
            <input 
                type="text" 
                class="filter-input" 
                id="filterInput" 
                placeholder="输入币名筛选..."
                onkeyup="applyFilter()"
            >
            <button class="btn btn-primary" onclick="clearFilter()">
                <i class="fas fa-times"></i> 清除筛选
            </button>
        </div>

        <!-- 三栏布局 -->
        <div class="main-content">
            <!-- 左栏：汇总统计（7列） -->
            <div class="panel left-panel">
                <div class="panel-header">价格汇总统计</div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">币名</th>
                                <th style="width: 120px;">最高价格</th>
                                <th style="width: 60px;">计次</th>
                                <th style="width: 120px;">最低价格</th>
                                <th style="width: 60px;">计次</th>
                                <th style="width: 80px;">最高占比</th>
                                <th style="width: 80px;">最低占比</th>
                            </tr>
                        </thead>
                        <tbody id="leftTableBody">
                            <tr>
                                <td colspan="7" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 中栏：极值记录（4列） -->
            <div class="panel middle-panel">
                <div class="panel-header">极值记录</div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">币名</th>
                                <th style="width: 150px;">时间</th>
                                <th style="width: 80px;">状态</th>
                                <th style="width: 80px;">跳播</th>
                            </tr>
                        </thead>
                        <tbody id="middleTableBody">
                            <tr>
                                <td colspan="4" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 右栏：时间段统计（4列） -->
            <div class="panel right-panel">
                <div class="panel-header">时间段统计</div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">币名</th>
                                <th style="width: 80px;">今天</th>
                                <th style="width: 80px;">三日</th>
                                <th style="width: 80px;">七天</th>
                            </tr>
                        </thead>
                        <tbody id="rightTableBody">
                            <tr>
                                <td colspan="4" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/compare.js"></script>
</body>
</html>
