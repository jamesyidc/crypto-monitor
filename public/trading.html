<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟交易系统 - 加密货币监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .trade-row { transition: background-color 0.3s; }
        .trade-row:hover { background-color: #f3f4f6; }
        .profit { color: #10b981; font-weight: bold; }
        .loss { color: #ef4444; font-weight: bold; }
        .modal-overlay { background: rgba(0, 0, 0, 0.5); }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-paused { background: #fef3c7; color: #92400e; }
        .status-stopped { background: #fee2e2; color: #991b1b; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- 顶部导航 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-chart-line mr-2 text-green-600"></i>
                        模拟交易系统
                    </h1>
                    <p class="text-gray-600">策略回测 · 风险模拟 · 自动交易</p>
                </div>
                <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg transition">
                    <i class="fas fa-arrow-left mr-2"></i>返回首页
                </a>
            </div>
        </div>

        <!-- 账户选择器 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-user-circle mr-2"></i>我的账户
                </h2>
                <button id="createAccountBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                    <i class="fas fa-plus mr-2"></i>创建账户
                </button>
            </div>
            <div id="accountsList" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 账户卡片将在这里生成 -->
            </div>
        </div>

        <!-- 当前账户详情（选择账户后显示） -->
        <div id="accountDetails" class="hidden">
            <!-- 账户统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-6 stat-card">
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-gray-500 text-sm">当前余额</div>
                        <i class="fas fa-wallet text-2xl text-blue-500"></i>
                    </div>
                    <div id="statBalance" class="text-2xl font-bold text-gray-800">$0.00</div>
                    <div id="statBalanceChange" class="text-xs text-gray-600 mt-1">--</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6 stat-card">
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-gray-500 text-sm">总盈亏</div>
                        <i class="fas fa-chart-bar text-2xl text-green-500"></i>
                    </div>
                    <div id="statProfitLoss" class="text-2xl font-bold">$0.00</div>
                    <div id="statProfitPercent" class="text-xs text-gray-600 mt-1">0.00%</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6 stat-card">
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-gray-500 text-sm">交易次数</div>
                        <i class="fas fa-exchange-alt text-2xl text-purple-500"></i>
                    </div>
                    <div id="statTotalTrades" class="text-2xl font-bold text-gray-800">0</div>
                    <div id="statWinRate" class="text-xs text-gray-600 mt-1">胜率: 0%</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6 stat-card">
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-gray-500 text-sm">杠杆倍数</div>
                        <i class="fas fa-layer-group text-2xl text-orange-500"></i>
                    </div>
                    <div id="statLeverage" class="text-2xl font-bold text-gray-800">1x</div>
                    <div id="statFeeRate" class="text-xs text-gray-600 mt-1">费率: 0.1%</div>
                </div>
            </div>

            <!-- 操作面板 -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-800">
                        <i class="fas fa-tools mr-2"></i>交易操作
                    </h2>
                    <div class="flex gap-2">
                        <button id="manualTradeBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                            <i class="fas fa-hand-pointer mr-2"></i>手动交易
                        </button>
                        <button id="autoTradeBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition">
                            <i class="fas fa-robot mr-2"></i>自动交易
                        </button>
                        <button id="pauseAccountBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white px-6 py-2 rounded-lg transition">
                            <i class="fas fa-pause mr-2"></i>暂停
                        </button>
                        <button id="refreshDataBtn" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg transition">
                            <i class="fas fa-sync-alt mr-2"></i>刷新
                        </button>
                    </div>
                </div>
                <div id="statusMessage" class="mt-4 hidden"></div>
            </div>

            <!-- 当前持仓 -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-list mr-2"></i>当前持仓
                </h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">币种</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">方向</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开仓价</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">数量</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">杠杆</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">手续费</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开仓时间</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody id="positionsTable" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="8" class="px-6 py-8 text-center text-gray-500">
                                    暂无持仓
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 交易历史 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-history mr-2"></i>交易历史
                </h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">币种</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">方向</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开仓价</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">平仓价</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">盈亏</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">盈亏%</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时间</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="8" class="px-6 py-8 text-center text-gray-500">
                                    暂无交易历史
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建账户模态框 -->
    <div id="createAccountModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeCreateAccountModal()"></div>
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full relative z-10 p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">创建模拟账户</h3>
                    <button onclick="closeCreateAccountModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <form id="createAccountForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">账户名称 *</label>
                        <input type="text" id="accountName" required 
                               placeholder="例如: 我的第一个账户" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">初始资金 (USDT) *</label>
                        <input type="number" id="initialBalance" required step="0.01" value="10000"
                               placeholder="例如: 10000" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">杠杆倍数</label>
                        <select id="leverage" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="1">1x (无杠杆)</option>
                            <option value="2">2x</option>
                            <option value="3">3x</option>
                            <option value="5">5x</option>
                            <option value="10">10x</option>
                            <option value="20">20x</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">交易费率</label>
                        <select id="tradingFeeRate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="0.001">0.1% (Maker)</option>
                            <option value="0.0015">0.15%</option>
                            <option value="0.002">0.2% (Taker)</option>
                        </select>
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-save mr-2"></i>创建
                        </button>
                        <button type="button" onclick="closeCreateAccountModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-times mr-2"></i>取消
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 手动交易模态框 -->
    <div id="manualTradeModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeManualTradeModal()"></div>
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full relative z-10 p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">手动交易</h3>
                    <button onclick="closeManualTradeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <form id="manualTradeForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">币种 *</label>
                        <input type="text" id="tradeSymbol" required 
                               placeholder="例如: BTC" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">方向 *</label>
                        <select id="tradeDirection" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="LONG">做多 (LONG)</option>
                            <option value="SHORT">做空 (SHORT)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">开仓价格 *</label>
                        <input type="number" id="tradePrice" required step="0.0001"
                               placeholder="当前价格" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">数量 *</label>
                        <input type="number" id="tradeQuantity" required step="0.0001"
                               placeholder="例如: 0.1" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-check mr-2"></i>开仓
                        </button>
                        <button type="button" onclick="closeManualTradeModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-times mr-2"></i>取消
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/trading.js"></script>
</body>
</html>
