<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据批量导入 - Crypto Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-8">
                    <h1 class="text-xl font-bold">
                        <i class="fas fa-file-import mr-2"></i>
                        数据批量导入
                    </h1>
                    <div class="flex gap-4">
                        <a href="/" class="hover:text-blue-200 transition">
                            <i class="fas fa-home mr-1"></i>首页
                        </a>
                        <a href="/correct.html" class="hover:text-blue-200 transition">
                            <i class="fas fa-edit mr-1"></i>数据纠错
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- 说明 -->
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
            <div class="flex items-center">
                <i class="fas fa-info-circle text-blue-500 text-xl mr-3"></i>
                <div>
                    <p class="font-bold text-blue-800">批量导入说明</p>
                    <p class="text-sm text-blue-700">请严格按照Excel表格格式输入数据，每行一个币种，字段之间用制表符（Tab）或逗号分隔</p>
                </div>
            </div>
        </div>

        <!-- 数据输入区 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-table mr-2"></i>数据输入区
            </h2>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">日期选择：</label>
                <input type="date" id="importDate" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">粘贴Excel数据：</label>
                <p class="text-xs text-gray-500 mb-2">格式示例：币种名称[Tab]最高价格[Tab]最低价格[Tab]急涨次数[Tab]急跌次数[Tab]创新高次数[Tab]创新低次数</p>
                <textarea 
                    id="dataInput" 
                    rows="15" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                    placeholder="示例：
BTC	111935.000000	111524.000000	0	0	0	0
ETH	3421.780000	3388.110000	0	0	0	0
BNB	656.140000	648.750000	0	0	0	0"></textarea>
            </div>

            <div class="flex gap-4">
                <button onclick="parseAndPreview()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                    <i class="fas fa-eye mr-2"></i>解析并预览
                </button>
                <button onclick="clearInput()" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition">
                    <i class="fas fa-eraser mr-2"></i>清空
                </button>
            </div>
        </div>

        <!-- 预览区 -->
        <div id="previewSection" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-eye mr-2"></i>数据预览
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b-2 border-gray-200 bg-gray-50">
                            <th class="text-left py-3 px-3">币种</th>
                            <th class="text-center py-3 px-3">最高价格</th>
                            <th class="text-center py-3 px-3">最低价格</th>
                            <th class="text-center py-3 px-3">急涨次数</th>
                            <th class="text-center py-3 px-3">急跌次数</th>
                            <th class="text-center py-3 px-3">创新高次数</th>
                            <th class="text-center py-3 px-3">创新低次数</th>
                        </tr>
                    </thead>
                    <tbody id="previewTableBody">
                    </tbody>
                </table>
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="submitData()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition">
                    <i class="fas fa-check mr-2"></i>确认导入
                </button>
                <button onclick="cancelPreview()" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition">
                    <i class="fas fa-times mr-2"></i>取消
                </button>
            </div>
        </div>

        <!-- 状态提示 -->
        <div id="statusMessage" class="hidden"></div>
    </div>

    <script src="/static/import.js"></script>
</body>
</html>
