<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>持仓追踪 - 加密货币监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .position-row { transition: background-color 0.3s; }
        .position-row:hover { background-color: #f3f4f6; }
        .long-badge { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; }
        .short-badge { background: #fee2e2; color: #991b1b; padding: 4px 12px; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; }
        .profit-positive { color: #10b981; font-weight: bold; }
        .profit-negative { color: #ef4444; font-weight: bold; }
        .modal-overlay { background: rgba(0, 0, 0, 0.5); }
        .alert-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .alert-top { background: #fecaca; color: #991b1b; }
        .alert-bottom { background: #bbf7d0; color: #166534; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- 顶部导航 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-wallet mr-2 text-blue-600"></i>
                        持仓追踪
                    </h1>
                    <p class="text-gray-600">实时监控持仓状态 · 自动顶底预警</p>
                </div>
                <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg transition">
                    <i class="fas fa-arrow-left mr-2"></i>返回首页
                </a>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="statsCards">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">活跃持仓</p>
                        <p class="text-2xl font-bold text-gray-800" id="activeCount">-</p>
                    </div>
                    <i class="fas fa-chart-line text-3xl text-blue-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">多单数量</p>
                        <p class="text-2xl font-bold text-green-600" id="longCount">-</p>
                    </div>
                    <i class="fas fa-arrow-up text-3xl text-green-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">空单数量</p>
                        <p class="text-2xl font-bold text-red-600" id="shortCount">-</p>
                    </div>
                    <i class="fas fa-arrow-down text-3xl text-red-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">预警次数</p>
                        <p class="text-2xl font-bold text-yellow-600" id="alertCount">-</p>
                    </div>
                    <i class="fas fa-bell text-3xl text-yellow-500"></i>
                </div>
            </div>
        </div>

        <!-- 操作面板 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold text-gray-800">
                        <i class="fas fa-tools mr-2"></i>操作面板
                    </h2>
                    <div class="text-sm text-gray-600 bg-gray-100 px-4 py-2 rounded-lg">
                        <i class="fas fa-clock mr-2"></i>
                        <span id="countdown">30秒后自动刷新</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="addPositionBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                        <i class="fas fa-plus mr-2"></i>添加持仓
                    </button>
                    <button id="checkAlertsBtn" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2 rounded-lg transition">
                        <i class="fas fa-bell mr-2"></i>检查预警
                    </button>
                    <button id="refreshBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition">
                        <i class="fas fa-sync-alt mr-2"></i>刷新
                    </button>
                </div>
            </div>
            <div id="statusMessage" class="mt-4 hidden"></div>
        </div>

        <!-- 持仓列表 -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-list mr-2"></i>持仓列表
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">币种</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">方向</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开仓价</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">当前价</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">盈亏</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">数量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">止损/止盈</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">预警状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开仓时间</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody id="positionsTable" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="10" class="px-6 py-8 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin mr-2"></i>加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加/编辑持仓模态框 -->
    <div id="positionModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closePositionModal()"></div>
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full relative z-10 p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-800" id="modalTitle">添加持仓</h3>
                    <button onclick="closePositionModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <form id="positionForm" class="space-y-4">
                    <input type="hidden" id="positionId" value="">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">币种 *</label>
                            <input type="text" id="symbol" required 
                                   placeholder="例如: BTCUSDT" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">持仓方向 *</label>
                            <select id="positionType" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="LONG">多单 (LONG)</option>
                                <option value="SHORT">空单 (SHORT)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">开仓价格 *</label>
                            <input type="number" id="entryPrice" required step="0.0001" 
                                   placeholder="例如: 50000.00" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">持仓数量</label>
                            <input type="number" id="quantity" step="0.0001" 
                                   placeholder="例如: 0.5" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">止损价格</label>
                            <input type="number" id="stopLoss" step="0.0001" 
                                   placeholder="例如: 48000.00" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">止盈价格</label>
                            <input type="number" id="takeProfit" step="0.0001" 
                                   placeholder="例如: 55000.00" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">备注</label>
                        <textarea id="notes" rows="3" 
                                  placeholder="持仓备注信息..." 
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-save mr-2"></i>保存
                        </button>
                        <button type="button" onclick="closePositionModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg transition font-medium">
                            <i class="fas fa-times mr-2"></i>取消
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/positions.js"></script>
</body>
</html>
