<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列结构测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">📋 K线表格列结构测试</h1>
    
    <div class="mb-4 bg-yellow-100 p-4 rounded">
        <h2 class="font-bold text-red-600">⚠️ 重要提示：</h2>
        <p class="text-sm mt-2">请仔细查看下表的<span class="bg-blue-200 px-2 py-1 font-bold">第2列（蓝色背景）</span>和<span class="bg-orange-200 px-2 py-1 font-bold">第3列（橙色背景）</span>：</p>
        <ul class="list-disc ml-6 text-sm mt-2">
            <li><strong>第2列（蓝色）</strong>应该显示"起涨/起跌点"数据</li>
            <li><strong>第3列（橙色）</strong>应该显示"操作提示"数据</li>
            <li>如果能看到这两列的内容，说明代码工作正常</li>
            <li>如果看不到内容（空白），请截图并检查浏览器控制台</li>
        </ul>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-xs border-collapse">
            <thead class="bg-gray-800 text-white sticky top-0">
                <tr>
                    <th class="py-2 px-2 border border-gray-600">第1列<br>时间</th>
                    <th class="py-2 px-2 border border-gray-600 bg-blue-600">第2列<br>起涨/起跌点</th>
                    <th class="py-2 px-2 border border-gray-600 bg-orange-600">第3列<br>操作提示</th>
                    <th class="py-2 px-2 border border-gray-600">第4列<br>开盘</th>
                    <th class="py-2 px-2 border border-gray-600">第5列<br>收盘</th>
                    <th class="py-2 px-2 border border-gray-600">第6列<br>涨跌幅</th>
                </tr>
            </thead>
            <tbody id="testBody">
                <!-- 将由JS填充 -->
            </tbody>
        </table>
    </div>
    
    <div id="status" class="mt-4 p-4 bg-gray-100 rounded font-mono text-sm"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const logs = [];
        
        function addLog(msg, isError = false) {
            logs.push(`<div class="${isError ? 'text-red-600' : 'text-green-600'}">${msg}</div>`);
            statusDiv.innerHTML = logs.join('');
            console.log(msg);
        }
        
        addLog('✓ JavaScript 开始执行');
        
        // 生成25条测试数据
        const data = [];
        for (let i = 0; i < 25; i++) {
            data.push({
                time: `2025/10/29 17:${String(60 - i*2).padStart(2, '0')}`,
                change: `${Math.random() > 0.5 ? '+' : '-'}${(Math.random() * 0.5).toFixed(2)}%`,
                open: 112000 + Math.random() * 100,
                close: 112000 + Math.random() * 100
            });
        }
        
        addLog(`✓ 生成了 ${data.length} 条测试数据`);
        
        // 渲染表格
        const tbody = document.getElementById('testBody');
        let htmlRows = '';
        
        data.forEach((k, index) => {
            // 计算累计涨跌幅
            let cumulative = 0;
            let hasData = false;
            
            if (index >= 20) {
                for (let i = index - 20; i < index; i++) {
                    const val = parseFloat(data[i].change);
                    if (!isNaN(val)) cumulative += val;
                }
                hasData = true;
            }
            
            // 生成徽章
            const badge = hasData
                ? `<span class="inline-block px-2 py-1 rounded ${cumulative > 2 ? 'bg-green-600 text-white' : cumulative < -3 ? 'bg-red-600 text-white' : 'bg-gray-400 text-white'}">${cumulative > 0 ? '+' : ''}${cumulative.toFixed(2)}%</span>`
                : '<span class="text-gray-500">-</span>';
            
            // 操作提示（简化测试：每5行显示一次）
            const tip = (index % 5 === 0) ? '<span class="bg-orange-500 text-white px-2 py-1 rounded">测试提示</span>' : '-';
            
            htmlRows += `
                <tr class="hover:bg-gray-50">
                    <td class="py-2 px-2 border">${k.time}</td>
                    <td class="py-2 px-2 border text-center bg-blue-50">${badge}</td>
                    <td class="py-2 px-2 border text-center bg-orange-50">${tip}</td>
                    <td class="py-2 px-2 border text-right">${k.open.toFixed(2)}</td>
                    <td class="py-2 px-2 border text-right">${k.close.toFixed(2)}</td>
                    <td class="py-2 px-2 border text-right ${k.change.startsWith('+') ? 'text-green-600' : 'text-red-600'}">${k.change}</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = htmlRows;
        addLog(`✓ 表格渲染完成（${data.length}行）`);
        addLog('');
        addLog('🔍 检查项目：');
        addLog('  1. 第2列（蓝色背景）前20行应显示 "-"');
        addLog('  2. 第2列第20行及以后应显示百分比（如 "+0.50%" 或 "-1.20%"）');
        addLog('  3. 第3列（橙色背景）每5行应显示"测试提示"橙色徽章');
        addLog('  4. 如果上述内容都能看到，说明代码工作正常');
        addLog('  5. 如果看不到，请按 F12 打开控制台检查错误');
    </script>
</body>
</html>
