<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>买卖点信号分析 - 加密货币监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .signal-badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .buy-signal {
            background: #dcfce7;
            color: #166534;
        }
        .sell-signal {
            background: #fee2e2;
            color: #991b1b;
        }
        .strength-bar {
            height: 8px;
            border-radius: 4px;
            background: #e5e7eb;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            transition: width 0.3s;
        }
        .strength-high { background: #10b981; }
        .strength-medium { background: #f59e0b; }
        .strength-low { background: #6b7280; }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .detail-label {
            color: #6b7280;
            font-size: 0.875rem;
        }
        .detail-value {
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- 标题栏 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-signal mr-2 text-green-600"></i>
                        买卖点信号分析
                    </h1>
                    <p class="text-gray-600">基于多因子模块的贝叶斯定理的高级买卖点识别系统</p>
                </div>
                <div class="text-right">
                    <div class="flex gap-2 justify-end mb-2">
                        <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition text-sm inline-flex items-center">
                            <i class="fas fa-home mr-2"></i>返回首页
                        </a>
                        <a href="/static/signal-config.html" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg transition text-sm inline-flex items-center">
                            <i class="fas fa-cog mr-2"></i>TG发送设置
                        </a>
                        <button id="refresh24hBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition text-sm">
                            <i class="fas fa-clock mr-2"></i>过去24小时
                        </button>
                        <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition">
                            <i class="fas fa-sync-alt mr-2"></i>实时信号
                        </button>
                    </div>
                    <div class="flex items-center justify-end gap-2 mb-2">
                        <span class="text-xs px-3 py-1 bg-green-100 text-green-700 rounded-full font-semibold animate-pulse">
                            <i class="fas fa-sync-alt mr-1"></i>自动刷新：每1分钟
                        </span>
                    </div>
                    <div class="text-sm text-gray-500" id="lastUpdate"></div>
                    <div class="text-xs text-gray-400 mt-1" id="dataRange"></div>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-6">
            <div class="bg-gradient-to-br from-yellow-400 to-orange-500 rounded-lg shadow-md p-6 text-white">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-white text-sm opacity-90">预警触发</p>
                        <p class="text-3xl font-bold" id="totalAlerts">0</p>
                    </div>
                    <div class="bg-white bg-opacity-20 p-3 rounded-full">
                        <i class="fas fa-exclamation-triangle text-white text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">总信号数</p>
                        <p class="text-3xl font-bold text-gray-800" id="totalSignals">0</p>
                    </div>
                    <div class="bg-blue-100 p-3 rounded-full">
                        <i class="fas fa-signal text-blue-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">做多信号</p>
                        <p class="text-3xl font-bold text-green-600" id="buySignals">0</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full">
                        <i class="fas fa-arrow-up text-green-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">做空信号</p>
                        <p class="text-3xl font-bold text-red-600" id="sellSignals">0</p>
                    </div>
                    <div class="bg-red-100 p-3 rounded-full">
                        <i class="fas fa-arrow-down text-red-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">有信号币种</p>
                        <p class="text-3xl font-bold text-purple-600" id="symbolsWithSignals">0</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <i class="fas fa-coins text-purple-600 text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 预警池 - 所有触发条件的K线 -->
        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-lg shadow-lg p-6 mb-6 border-2 border-yellow-400">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-exclamation-triangle mr-2 text-yellow-600 animate-pulse"></i>
                        预警池（过去24小时触发）
                    </h2>
                    <p class="text-sm text-gray-600 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>
                        显示所有满足预警条件的K线数据（同币同轮自动去重）
                    </p>
                </div>
                <div class="flex flex-col gap-2 text-sm items-end">
                    <span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full font-semibold">
                        <i class="fas fa-bell mr-1"></i>
                        <span id="alertPoolCount">0</span> 个预警
                    </span>
                    <span class="text-xs text-gray-500" id="alertPoolTimeRange">
                        <i class="fas fa-clock mr-1"></i>
                        数据范围：加载中...
                    </span>
                </div>
            </div>
            
            <!-- 过滤器 -->
            <div class="mb-4 p-4 bg-white rounded-lg border border-yellow-300">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-filter text-blue-600"></i>
                    <span class="font-semibold text-gray-700">条件筛选：</span>
                    <button onclick="clearAlertFilters()" class="ml-auto text-xs px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded-full transition">
                        <i class="fas fa-times mr-1"></i>清空
                    </button>
                </div>
                <div class="flex flex-wrap gap-2">
                    <!-- 成交量筛选 -->
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="alert-filter" data-filter-type="volume" data-filter-value="V1" 
                               class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="ml-2 px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium hover:bg-blue-200 transition">
                            <i class="fas fa-chart-bar mr-1"></i>V1
                        </span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="alert-filter" data-filter-type="volume" data-filter-value="V2" 
                               class="form-checkbox h-4 w-4 text-purple-600 rounded border-gray-300 focus:ring-purple-500">
                        <span class="ml-2 px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium hover:bg-purple-200 transition">
                            <i class="fas fa-chart-bar mr-1"></i>V2
                        </span>
                    </label>
                    
                    <!-- 涨跌幅筛选 -->
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="alert-filter" data-filter-type="change" data-filter-value="up" 
                               class="form-checkbox h-4 w-4 text-green-600 rounded border-gray-300 focus:ring-green-500">
                        <span class="ml-2 px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium hover:bg-green-200 transition">
                            <i class="fas fa-arrow-up mr-1"></i>涨幅≥1%
                        </span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="alert-filter" data-filter-type="change" data-filter-value="down" 
                               class="form-checkbox h-4 w-4 text-red-600 rounded border-gray-300 focus:ring-red-500">
                        <span class="ml-2 px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm font-medium hover:bg-red-200 transition">
                            <i class="fas fa-arrow-down mr-1"></i>跌幅≥1%
                        </span>
                    </label>
                    
                    <!-- 震荡筛选 -->
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="alert-filter" data-filter-type="change" data-filter-value="flat" 
                               class="form-checkbox h-4 w-4 text-orange-600 rounded border-gray-300 focus:ring-orange-500">
                        <span class="ml-2 px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm font-medium hover:bg-orange-200 transition">
                            <i class="fas fa-arrows-alt-h mr-1"></i>震荡±1%
                        </span>
                    </label>
                    
                    <!-- 主升信号筛选 -->
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="signal-filter" data-filter-type="signal" data-filter-value="main_rise" 
                               class="form-checkbox h-4 w-4 text-yellow-600 rounded border-gray-300 focus:ring-yellow-500">
                        <span class="ml-2 px-3 py-1 bg-gradient-to-r from-yellow-100 to-orange-100 text-yellow-800 rounded-full text-sm font-bold hover:from-yellow-200 hover:to-orange-200 transition shadow-sm">
                            <i class="fas fa-rocket mr-1"></i>主升信号 🚀
                        </span>
                    </label>
                </div>
            </div>
            
            <div id="alertPool" class="space-y-2 max-h-96 overflow-y-auto">
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-spinner loading text-4xl mb-2"></i>
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <!-- 高强度信号 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- 顶级做多信号 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-line mr-2 text-green-600"></i>
                    顶级做多信号（强度≥60）
                </h2>
                <div id="topBuySignals" class="space-y-3">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-spinner loading text-4xl mb-2"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 顶级做空信号 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-line mr-2 text-red-600"></i>
                    顶级做空信号（强度≥60）
                </h2>
                <div id="topSellSignals" class="space-y-3">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-spinner loading text-4xl mb-2"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 所有币种信号详情 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-list mr-2 text-blue-600"></i>
                所有币种信号详情
            </h2>
            <div id="allSignals" class="space-y-4">
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-spinner loading text-4xl mb-2"></i>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/signal.js"></script>
</body>
</html>
