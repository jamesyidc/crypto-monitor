<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据纠错 - Crypto Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-8">
                    <h1 class="text-xl font-bold">
                        <i class="fas fa-chart-line mr-2"></i>
                        Crypto Monitor
                    </h1>
                    <div class="flex gap-4">
                        <a href="/" class="hover:text-blue-200 transition">
                            <i class="fas fa-home mr-1"></i>首页
                        </a>
                        <a href="/kline.html" class="hover:text-blue-200 transition">
                            <i class="fas fa-chart-bar mr-1"></i>K线
                        </a>
                        <a href="/pattern.html" class="hover:text-blue-200 transition">
                            <i class="fas fa-brain mr-1"></i>特征库
                        </a>
                        <a href="/correct.html" class="text-yellow-300 font-bold">
                            <i class="fas fa-edit mr-1"></i>数据纠错
                        </a>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="saveAllData()" id="saveBtn" class="px-4 py-2 bg-green-500 hover:bg-green-600 rounded-lg font-bold transition">
                        <i class="fas fa-save mr-2"></i>保存修改
                    </button>
                    <button onclick="resetToday()" id="resetBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg font-bold transition">
                        <i class="fas fa-trash mr-2"></i>清空今日数据
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- 提示信息 -->
        <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 mb-6">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-yellow-500 text-xl mr-3"></i>
                <div>
                    <p class="font-bold text-yellow-800">数据纠错说明</p>
                    <p class="text-sm text-yellow-700">您可以手动修改每个币种的统计数据，包括急涨急跌次数、创新高创新低次数。修改后请点击"保存修改"。</p>
                </div>
            </div>
        </div>

        <!-- 日期选择 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex items-center gap-4">
                <label class="font-bold text-gray-700">选择日期:</label>
                <input type="date" id="dateInput" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
                <button onclick="loadData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                    <i class="fas fa-search mr-2"></i>查询
                </button>
                <span id="dataStatus" class="text-gray-600 text-sm ml-4"></span>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-table mr-2"></i>每日统计数据
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b-2 border-gray-200 bg-gray-50">
                            <th class="text-left py-3 px-3 font-bold">币种</th>
                            <th class="text-center py-3 px-3 font-bold text-green-600">
                                <i class="fas fa-arrow-trend-up mr-1"></i>总急涨次数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-red-600">
                                <i class="fas fa-arrow-trend-down mr-1"></i>总急跌次数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-blue-600">
                                <i class="fas fa-trophy mr-1"></i>创新高次数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-orange-600">
                                <i class="fas fa-chart-line mr-1"></i>创新低次数
                            </th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-gray-500">
                                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>请选择日期并点击查询</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 风险提示轮次数据 -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-exclamation-circle mr-2"></i>风险提示轮次统计
            </h2>
            <div id="roundsContainer" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b-2 border-gray-200 bg-gray-50">
                            <th class="text-left py-3 px-3 font-bold">轮次时间</th>
                            <th class="text-center py-3 px-3 font-bold text-green-600">
                                <i class="fas fa-arrow-up mr-1"></i>绿盘数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-red-600">
                                <i class="fas fa-arrow-down mr-1"></i>红盘数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-blue-600">
                                <i class="fas fa-chart-line mr-1"></i>急涨数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-orange-600">
                                <i class="fas fa-chart-line mr-1"></i>急跌数
                            </th>
                            <th class="text-center py-3 px-3 font-bold text-purple-600">
                                <i class="fas fa-exclamation-triangle mr-1"></i>风险提示次数
                            </th>
                        </tr>
                    </thead>
                    <tbody id="roundsTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">
                                <i class="fas fa-info-circle text-2xl mb-2"></i>
                                <p>请选择日期并查询数据后显示</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 全局统计 -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mt-6">
            <div class="bg-green-50 border-l-4 border-green-500 rounded-lg p-4">
                <div class="text-sm text-gray-600 mb-1">总急涨次数</div>
                <div id="totalSurges" class="text-2xl font-bold text-green-600">0</div>
            </div>
            <div class="bg-red-50 border-l-4 border-red-500 rounded-lg p-4">
                <div class="text-sm text-gray-600 mb-1">总急跌次数</div>
                <div id="totalCrashes" class="text-2xl font-bold text-red-600">0</div>
            </div>
            <div class="bg-blue-50 border-l-4 border-blue-500 rounded-lg p-4">
                <div class="text-sm text-gray-600 mb-1">总创新高次数</div>
                <div id="totalNewHighs" class="text-2xl font-bold text-blue-600">0</div>
            </div>
            <div class="bg-orange-50 border-l-4 border-orange-500 rounded-lg p-4">
                <div class="text-sm text-gray-600 mb-1">总创新低次数</div>
                <div id="totalNewLows" class="text-2xl font-bold text-orange-600">0</div>
            </div>
            <div class="bg-purple-50 border-l-4 border-purple-500 rounded-lg p-4">
                <div class="text-sm text-gray-600 mb-1">总风险提示次数</div>
                <div id="totalRiskAlerts" class="text-2xl font-bold text-purple-600">0</div>
            </div>
        </div>
    </div>

    <script src="/static/correct.js"></script>
</body>
</html>
