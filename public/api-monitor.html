<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 管理中控台 - 实时监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .metric-card {
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
        
        .request-item {
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen p-6">
        <!-- 顶部标题栏 -->
        <div class="mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                        <i class="fas fa-server mr-3 text-blue-600"></i>
                        API 管理中控台
                    </h1>
                    <p class="text-gray-600 mt-1">实时监控 API 请求状态和性能指标</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <span class="status-dot bg-green-500"></span>
                        <span class="text-sm text-gray-600">系统运行中</span>
                    </div>
                    <button onclick="toggleAutoRefresh()" id="autoRefreshBtn" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-sync-alt mr-2"></i>自动刷新: 开
                    </button>
                    <button onclick="manualRefresh()" 
                            class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                        <i class="fas fa-redo mr-2"></i>手动刷新
                    </button>
                </div>
            </div>
        </div>

        <!-- 系统状态概览 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <!-- 系统状态 -->
            <div class="metric-card bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 text-sm font-medium">系统状态</span>
                    <i class="fas fa-heartbeat text-2xl" id="statusIcon"></i>
                </div>
                <div class="text-3xl font-bold mb-1" id="systemStatus">正常</div>
                <div class="text-xs text-gray-500">拥堵指数: <span id="congestionLevel">0%</span></div>
            </div>

            <!-- 活跃请求 -->
            <div class="metric-card bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 text-sm font-medium">活跃请求</span>
                    <i class="fas fa-exchange-alt text-2xl text-blue-600"></i>
                </div>
                <div class="text-3xl font-bold text-blue-600 mb-1">
                    <span id="activeRequests">0</span>
                    <span class="text-lg text-gray-400">/ <span id="maxConcurrent">3</span></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                    <div class="progress-bar bg-blue-600 h-2 rounded-full" id="activeProgress" style="width: 0%"></div>
                </div>
            </div>

            <!-- 队列长度 -->
            <div class="metric-card bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 text-sm font-medium">队列长度</span>
                    <i class="fas fa-list-ol text-2xl text-yellow-600"></i>
                </div>
                <div class="text-3xl font-bold text-yellow-600 mb-1">
                    <span id="queueSize">0</span>
                    <span class="text-lg text-gray-400">/ <span id="maxQueue">50</span></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                    <div class="progress-bar bg-yellow-600 h-2 rounded-full" id="queueProgress" style="width: 0%"></div>
                </div>
            </div>

            <!-- 成功率 -->
            <div class="metric-card bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 text-sm font-medium">成功率</span>
                    <i class="fas fa-check-circle text-2xl text-green-600"></i>
                </div>
                <div class="text-3xl font-bold text-green-600 mb-1" id="successRate">100%</div>
                <div class="text-xs text-gray-500">
                    成功: <span id="successCount">0</span> / 
                    失败: <span id="failedCount">0</span>
                </div>
            </div>
        </div>

        <!-- 详细统计 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- 请求统计 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-chart-bar mr-2 text-purple-600"></i>
                    请求统计
                </h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">总请求数</span>
                        <span class="font-bold text-lg" id="totalRequests">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 flex items-center">
                            <i class="fas fa-check text-green-500 mr-2"></i>成功
                        </span>
                        <span class="font-bold text-green-600" id="successRequests">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 flex items-center">
                            <i class="fas fa-times text-red-500 mr-2"></i>失败
                        </span>
                        <span class="font-bold text-red-600" id="failedRequests">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 flex items-center">
                            <i class="fas fa-hdd text-blue-500 mr-2"></i>缓存命中
                        </span>
                        <span class="font-bold text-blue-600" id="cachedRequests">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 flex items-center">
                            <i class="fas fa-ban text-red-500 mr-2"></i>被拒绝
                        </span>
                        <span class="font-bold text-red-600" id="rejectedRequests">0</span>
                    </div>
                </div>
            </div>

            <!-- 缓存统计 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-database mr-2 text-indigo-600"></i>
                    缓存与配置
                </h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">缓存条目</span>
                        <span class="font-bold text-lg" id="cacheSize">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">缓存超时</span>
                        <span class="font-bold" id="cacheTimeout">5s</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">最小间隔</span>
                        <span class="font-bold" id="minInterval">200ms</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">重试次数</span>
                        <span class="font-bold" id="retryAttempts">2</span>
                    </div>
                    <div class="pt-2 border-t">
                        <button onclick="clearCache()" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                            <i class="fas fa-trash mr-2"></i>清空缓存
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时请求队列 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fas fa-stream mr-2 text-orange-600"></i>
                    实时请求队列
                    <span class="ml-3 px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded-full" id="queueCount">0</span>
                </h3>
                <div class="text-sm text-gray-600">
                    <i class="fas fa-clock mr-1"></i>最后更新: <span id="lastUpdate">--</span>
                </div>
            </div>
            
            <div id="queueList" class="space-y-2 max-h-80 overflow-y-auto">
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-inbox text-4xl mb-2"></i>
                    <p>队列为空</p>
                </div>
            </div>
        </div>

        <!-- 活跃请求列表 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fas fa-spinner fa-spin mr-2 text-blue-600"></i>
                    活跃请求
                    <span class="ml-3 px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full" id="activeCount">0</span>
                </h3>
            </div>
            
            <div id="activeList" class="space-y-2">
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-check-circle text-4xl mb-2"></i>
                    <p>暂无活跃请求</p>
                </div>
            </div>
        </div>

        <!-- 请求历史（最近10条） -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-history mr-2 text-gray-600"></i>
                请求历史（最近10条）
            </h3>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-gray-600">时间</th>
                            <th class="px-4 py-3 text-left text-gray-600">方法</th>
                            <th class="px-4 py-3 text-left text-gray-600">URL</th>
                            <th class="px-4 py-3 text-left text-gray-600">优先级</th>
                            <th class="px-4 py-3 text-left text-gray-600">状态</th>
                            <th class="px-4 py-3 text-left text-gray-600">耗时</th>
                        </tr>
                    </thead>
                    <tbody id="historyList">
                        <tr>
                            <td colspan="6" class="px-4 py-8 text-center text-gray-400">
                                暂无历史记录
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/static/api-manager.js"></script>
    <script src="/static/api-wrapper.js"></script>
    <script>
        let autoRefresh = true;
        let refreshInterval = null;
        let requestHistory = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎛️ API 监控中控台加载完成');
            startAutoRefresh();
            updateDashboard();
        });

        // 切换自动刷新
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefresh) {
                btn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i>自动刷新: 开';
                btn.classList.remove('bg-gray-600');
                btn.classList.add('bg-blue-600');
                startAutoRefresh();
            } else {
                btn.innerHTML = '<i class="fas fa-pause mr-2"></i>自动刷新: 关';
                btn.classList.remove('bg-blue-600');
                btn.classList.add('bg-gray-600');
                stopAutoRefresh();
            }
        }

        // 开始自动刷新
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(updateDashboard, 1000); // 每秒更新
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // 手动刷新
        function manualRefresh() {
            updateDashboard();
            showToast('✅ 已刷新', 'success');
        }

        // 更新仪表板
        function updateDashboard() {
            if (!window.apiManager) {
                console.warn('⚠️ API Manager 未初始化');
                return;
            }

            const stats = window.apiManager.getStats();
            
            // 更新系统状态
            updateSystemStatus(stats);
            
            // 更新统计数据
            updateStatistics(stats);
            
            // 更新队列显示
            updateQueueDisplay();
            
            // 更新活跃请求显示
            updateActiveDisplay();
            
            // 更新最后更新时间
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN');
        }

        // 更新系统状态
        function updateSystemStatus(stats) {
            const activeRequests = stats.activeRequests || 0;
            const queueSize = stats.queueSize || 0;
            const maxConcurrent = window.apiManager.maxConcurrent || 3;
            const maxQueue = window.apiManager.maxQueueSize || 50;
            
            // 计算拥堵指数
            const activeRatio = activeRequests / maxConcurrent;
            const queueRatio = queueSize / maxQueue;
            const congestionLevel = Math.round((activeRatio * 0.4 + queueRatio * 0.6) * 100);
            
            // 更新状态显示
            const statusIcon = document.getElementById('statusIcon');
            const systemStatus = document.getElementById('systemStatus');
            const congestionElement = document.getElementById('congestionLevel');
            
            if (congestionLevel < 30) {
                statusIcon.className = 'fas fa-heartbeat text-2xl text-green-500';
                systemStatus.textContent = '正常';
                systemStatus.className = 'text-3xl font-bold text-green-600';
            } else if (congestionLevel < 70) {
                statusIcon.className = 'fas fa-exclamation-triangle text-2xl text-yellow-500';
                systemStatus.textContent = '繁忙';
                systemStatus.className = 'text-3xl font-bold text-yellow-600';
            } else {
                statusIcon.className = 'fas fa-exclamation-circle text-2xl text-red-500 blink';
                systemStatus.textContent = '拥堵';
                systemStatus.className = 'text-3xl font-bold text-red-600';
            }
            
            congestionElement.textContent = congestionLevel + '%';
            
            // 更新活跃请求
            document.getElementById('activeRequests').textContent = activeRequests;
            document.getElementById('maxConcurrent').textContent = maxConcurrent;
            document.getElementById('activeProgress').style.width = (activeRatio * 100) + '%';
            
            // 更新队列长度
            document.getElementById('queueSize').textContent = queueSize;
            document.getElementById('maxQueue').textContent = maxQueue;
            document.getElementById('queueProgress').style.width = (queueRatio * 100) + '%';
            
            // 更新成功率
            const successRate = stats.successRate || '100%';
            document.getElementById('successRate').textContent = successRate;
            document.getElementById('successCount').textContent = stats.success || 0;
            document.getElementById('failedCount').textContent = stats.failed || 0;
        }

        // 更新统计数据
        function updateStatistics(stats) {
            document.getElementById('totalRequests').textContent = stats.total || 0;
            document.getElementById('successRequests').textContent = stats.success || 0;
            document.getElementById('failedRequests').textContent = stats.failed || 0;
            document.getElementById('cachedRequests').textContent = stats.cached || 0;
            document.getElementById('rejectedRequests').textContent = stats.rejected || 0;
            document.getElementById('cacheSize').textContent = stats.cacheSize || 0;
            
            // 配置信息
            document.getElementById('cacheTimeout').textContent = (window.apiManager.cacheTimeout / 1000) + 's';
            document.getElementById('minInterval').textContent = window.apiManager.minInterval + 'ms';
            document.getElementById('retryAttempts').textContent = window.apiManager.retryAttempts;
        }

        // 更新队列显示
        function updateQueueDisplay() {
            const queue = window.apiManager.requestQueue || [];
            const queueList = document.getElementById('queueList');
            const queueCount = document.getElementById('queueCount');
            
            queueCount.textContent = queue.length;
            
            if (queue.length === 0) {
                queueList.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-inbox text-4xl mb-2"></i>
                        <p>队列为空</p>
                    </div>
                `;
                return;
            }
            
            queueList.innerHTML = queue.slice(0, 20).map((item, index) => {
                const priorityColor = getPriorityColor(item.priority);
                const waitTime = Date.now() - item.createdAt;
                
                return `
                    <div class="request-item flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="flex items-center space-x-3 flex-1">
                            <div class="flex-shrink-0 w-8 h-8 bg-${priorityColor}-100 text-${priorityColor}-700 rounded-full flex items-center justify-center font-bold text-sm">
                                ${index + 1}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-medium text-gray-900 truncate">${item.tag || item.url}</div>
                                <div class="text-xs text-gray-500">${item.method} ${item.url}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="text-right">
                                <div class="text-xs text-gray-500">优先级</div>
                                <div class="text-sm font-bold text-${priorityColor}-600">${item.priority}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-gray-500">等待</div>
                                <div class="text-sm font-medium">${formatDuration(waitTime)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 更新活跃请求显示
        function updateActiveDisplay() {
            const activeCount = window.apiManager.activeRequests || 0;
            const activeList = document.getElementById('activeList');
            const activeCountEl = document.getElementById('activeCount');
            
            activeCountEl.textContent = activeCount;
            
            if (activeCount === 0) {
                activeList.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-check-circle text-4xl mb-2"></i>
                        <p>暂无活跃请求</p>
                    </div>
                `;
                return;
            }
            
            // 这里可以显示正在处理的请求（需要扩展 API Manager 来追踪）
            activeList.innerHTML = `
                <div class="flex items-center justify-center p-6 bg-blue-50 rounded-lg border-2 border-blue-200">
                    <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mr-4"></i>
                    <div>
                        <div class="text-lg font-bold text-blue-900">正在处理 ${activeCount} 个请求</div>
                        <div class="text-sm text-blue-600">请稍候...</div>
                    </div>
                </div>
            `;
        }

        // 清空缓存
        function clearCache() {
            if (confirm('确定要清空所有缓存吗？')) {
                window.apiManager.clearCache();
                updateDashboard();
                showToast('✅ 缓存已清空', 'success');
            }
        }

        // 获取优先级颜色
        function getPriorityColor(priority) {
            if (priority >= 9) return 'red';
            if (priority >= 7) return 'orange';
            if (priority >= 5) return 'yellow';
            if (priority >= 3) return 'blue';
            return 'gray';
        }

        // 格式化持续时间
        function formatDuration(ms) {
            if (ms < 1000) return ms + 'ms';
            if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
            return (ms / 60000).toFixed(1) + 'm';
        }

        // 显示提示
        function showToast(message, type = 'info') {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
