<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号池测试页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🧪 信号池API测试</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">测试结果</h2>
            <div id="testResult" class="space-y-4">
                <p class="text-gray-500">加载中...</p>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold mb-4">信号列表</h2>
            <div id="signalsList" class="space-y-2">
                <p class="text-gray-500">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 测试页面加载开始...');
        
        async function testSignalPool() {
            const resultDiv = document.getElementById('testResult');
            const signalsDiv = document.getElementById('signalsList');
            
            try {
                console.log('📡 正在请求API...');
                const response = await fetch('/api/signal-pool/recent?timeframe=5m&klineCount=3');
                
                console.log('📊 响应状态:', response.status);
                console.log('📊 响应头:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('✅ 响应数据:', data);
                
                // 显示测试结果
                resultDiv.innerHTML = `
                    <div class="space-y-2">
                        <p class="flex justify-between">
                            <span class="font-semibold">成功状态:</span>
                            <span class="${data.success ? 'text-green-600' : 'text-red-600'}">${data.success ? '✅ 成功' : '❌ 失败'}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">信号总数:</span>
                            <span class="text-blue-600">${data.data.summary.total}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">做多信号:</span>
                            <span class="text-green-600">${data.data.summary.buy_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">做空信号:</span>
                            <span class="text-red-600">${data.data.summary.sell_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">开仓信号:</span>
                            <span class="text-purple-600">${data.data.summary.open_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">平仓信号:</span>
                            <span class="text-orange-600">${data.data.summary.close_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">当前多仓:</span>
                            <span>${data.data.summary.current_positions.long_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">当前空仓:</span>
                            <span>${data.data.summary.current_positions.short_count}</span>
                        </p>
                        <p class="flex justify-between">
                            <span class="font-semibold">过滤流程:</span>
                            <span class="text-sm">
                                原始${data.data.summary.filtering.raw_signals} → 
                                过滤${data.data.summary.filtering.after_smart_filter} → 
                                去重${data.data.summary.filtering.after_dedup} → 
                                最终${data.data.summary.filtering.final}
                            </span>
                        </p>
                    </div>
                `;
                
                // 显示信号列表
                if (data.data.signals.length === 0) {
                    signalsDiv.innerHTML = '<p class="text-gray-500 text-center py-4">暂无信号</p>';
                } else {
                    signalsDiv.innerHTML = data.data.signals.map(signal => `
                        <div class="border rounded-lg p-4 ${signal.signal_type === 'BUY' ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="font-bold text-lg">${signal.symbol}</span>
                                    <span class="ml-2 px-2 py-1 rounded text-sm ${signal.signal_type === 'BUY' ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">
                                        ${signal.signal_type} ${signal.action}
                                    </span>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold text-lg">$${signal.price.toLocaleString()}</p>
                                    <p class="text-sm text-gray-600">${signal.time}</p>
                                </div>
                            </div>
                            <p class="text-sm font-semibold text-gray-700 mb-1">${signal.strategy_name}</p>
                            <p class="text-sm text-gray-600">${signal.reason}</p>
                            <div class="mt-2 flex gap-4 text-sm">
                                <span>RSI: ${signal.indicators.rsi?.toFixed(2) || 'N/A'}</span>
                                <span>涨跌: ${signal.indicators.change || 'N/A'}</span>
                            </div>
                        </div>
                    `).join('');
                }
                
            } catch (error) {
                console.error('❌ 测试失败:', error);
                resultDiv.innerHTML = `
                    <div class="text-red-600">
                        <p class="font-bold">❌ 错误:</p>
                        <p>${error.message}</p>
                        <pre class="mt-2 p-2 bg-red-50 rounded text-sm overflow-auto">${error.stack || ''}</pre>
                    </div>
                `;
                signalsDiv.innerHTML = '<p class="text-red-500">加载失败</p>';
            }
        }
        
        // 页面加载时执行测试
        testSignalPool();
        
        // 每30秒自动刷新
        setInterval(testSignalPool, 30000);
    </script>
</body>
</html>
